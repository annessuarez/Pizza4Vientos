<div class="container my-4" id="pizzas">
  @if (mensajePopUp) {
    <div class="alert alert-success position-fixed bottom-0 end-0 m-4 shadow-lg" style="z-index: 1055;">
      <i class="bi bi-check-circle-fill me-2"></i>{{ mensajePopUp }}
    </div>
  }
  <div class="row row-cols-sm-1 row-cols-md-2 row-cols-lg-4 g-4">
    @for (pizza of pizzasFiltradas; track $index){
      <app-pizza-card [pizza]="pizza" 
                      (pizzaAgregada)="recibir_pizzas($event)">
      </app-pizza-card>
    }

    @if (pizzasFiltradas.length == 0) {
      <div class="col-12 text-center my-5">
        <div class="alert fondo-burdeos p-4 rounded-4 shadow-sm">
          <i class="bi bi-search fs-2 text-muted d-block mb-2"></i>
          <h5>No encontramos ninguna pizza con "{{ filtro() }}"</h5>
        </div>
      </div>
    }
  </div>
</div>
