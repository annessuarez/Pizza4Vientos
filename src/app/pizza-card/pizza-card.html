<div class="col">
  <div class="card h-100 bg-white">
    <div class="card-header bg-white d-flex justify-content-between align-items-baseline">
      <h5 class="mb-0 fs-6 fw-bold">{{ pizza().nombre }}</h5>
      <span class="mb-0 fs-6 fw-bold">{{ pizza().precio }}€</span>
    </div>

    <div class="text-center ">
      <img [src]="pizza().imagen" class="img-fluid" alt="foto pizza" />
    </div>

    <div class="card-body mb-0">
      <p>{{ pizza().ingredientes }}</p>
    </div>
    
    <form (submit)="Agregar_pizza(); $event.preventDefault()" class="d-flex mx-3 mb-3">
      <input (input)="cantidad = $any($event.target).value" type="number" class="form-control" min="1" placeholder="Cantidad"/>
      <button class="btn btn-success" id="btnCarrito" type="submit">
        <i class="bi bi-cart3"></i>
      </button>
    </form>
  </div>
</div>
