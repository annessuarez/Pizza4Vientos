<div class="col">
  <div class="card h-100">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fs-6 fw-bold">{{ pizza().nombre }}</h5>
      <span class="badge bg-success fs-6">{{ pizza().precio }}</span>
    </div>
    <img [src]="pizza().imagen" class="card-img-top" alt="card-image" />
    <div class="card-body">
      <p>{{ pizza().ingredientes }}</p>
    </div>

    <form (submit)="Agregar_pizza(); $event.preventDefault()" class="d-flex m-4">
      <input
        (input)="cantidad = $any($event.target).value"
        type="number"
        class="form-control"
        min="1"
        placeholder="Cantidad"
      />
      <button class="btn btn-success" type="submit">
        <i class="bi bi-cart3"></i>
      </button>
    </form>
  </div>
</div>
