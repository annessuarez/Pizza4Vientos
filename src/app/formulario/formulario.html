<div class="container mt-4 p-3 mb-2 bg-success text-white">
<form id="pedido">
  <h2>Realizar pedido</h2>

  <div class="card text-dark mb-3 p-3">
    <h5>Resumen de tu pedido</h5>
    @if (pedido().length == 0){
      <p>Todavía no has añadido pizzas al pedido.</p>
    } @else {
      <ul class="list-group list-group-flush">
        @for (pizza of pedido(); track $index){
          <li class="list-group-item">
            <span>{{ pizza.cantidad }}x{{ pizza.nombre }}</span>
            <span>{{ (pizza.precio * (pizza.cantidad || 1)) }} €</span>
          </li>
        }
      </ul>
    }
  </div>

    <div class="row g-3">
      <div class="col-md-6">
          <label for="inputdatetime3" class="col-sm-2 col-form-label text-nowrap fw-bolder">Hora de entrega:</label>
          <input type="datetime-local" class="form-control mb-3" id="inputdatetime3">
      </div>
      
      <div class="col-md-6">
        <label for="inputdirection3" class="col-sm-2 col-form-label text-nowrap fw-bolder">Dirección de envio</label>
        <input type="text" class="form-control mb-3" id="inputdirection3">
      </div>
    </div>

  <legend class="col-form-label text-nowrap m-0 p-0 text-white fw-medium">Tipo de pago</legend>
  <fieldset class="d-flex align-items-center gap-3 my-3">
    <div class="d-flex gap-2 m-2">
        <input type="radio" class="btn-check" name="gridRadios" id="gridRadios1" value="option1" checked autocomplete="off">
        <label class="btn btn-light rounded-pill px-3 py-1 shadow-sm d-flex align-items-center gap-2 fw-semibold" for="gridRadios1">
          <i class="bi bi-send-check"></i>
          <span>Bizum</span>
        </label>

        <input type="radio" class="btn-check" name="gridRadios" id="gridRadios2" value="option2" autocomplete="off">
        <label class="btn btn-light rounded-pill px-3 py-1 shadow-sm d-flex align-items-center gap-2 fw-semibold" for="gridRadios2">
          <i class="bi bi-credit-card"></i>
          <span>Tarjeta</span>
        </label>
      </div>
  </fieldset>

  <button type="submit" class="btn btn-light">Pedir y Pagar</button>
</form>
</div>
