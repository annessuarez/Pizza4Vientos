<div class="container mt-4 p-3 mb-2 bg-success text-white">
<form id="pedido">
  <h2>Realizar pedido</h2>
  <div class="row mb-3">
    <label for="inputdatetime3" class="col-sm-2 col-form-label">Hora de entrega:</label>
    <div class="col-sm-10">
      <input type="datetime-local" class="form-control" id="inputdatetime3">
    </div>
  </div>
  <div class="row mb-3">
    <label for="inputdirection3" class="col-sm-2 col-form-label">Dirección de envio</label>
    <div class="col-sm-10">
      <input type="text" class="form-control" id="inputdirection3">
    </div>
  </div>
  <fieldset class="row mb-3">
    <legend class="col-form-label col-sm-2 pt-0">Tipo de pago</legend>
    <div class="col-sm-10">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios1" value="option1" checked="">
        <label class="form-check-label" for="gridRadios1">
          Bizum
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios2" value="option2">
        <label class="form-check-label" for="gridRadios2">
          Tarjeta
        </label>
      </div>
    </div>
  </fieldset>
  <button type="submit" class="btn btn-light">Pedir y Pagar</button>
</form>
</div>
